[project]
name = "felt-processing"
version = "0.1.0"
description = "Scripts for generating FELT facial-tracking outputs from RAVDESS videos."
requires-python = ">=3.9"
dependencies = [
    "py-feat==0.6.2",
    "torch==2.2.0",
    "torchvision==0.17.0",
    "torchaudio==2.2.0",
    "pandas",
    "numpy<2",
    "scipy<1.12",
    "matplotlib",
    "seaborn",
    "imageio",
    "tqdm",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
