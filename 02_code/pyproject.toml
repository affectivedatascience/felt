[project]
name = "felt-processing"
version = "0.1.0"
description = "Scripts for generating FELT facial-tracking outputs from RAVDESS videos."
requires-python = ">=3.9"
dependencies = [
    "py-feat==0.6.2",
    "torch>=2.7,<2.10",
    "torchvision>=0.20,<0.24",
    "pandas",
    "numpy<2",
    "scipy<1.12",
    "matplotlib",
    "seaborn",
    "imageio[ffmpeg]",
    "tqdm",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
