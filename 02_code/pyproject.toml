[project]
name = "felt-processing"
version = "0.1.0"
description = "Scripts for generating FELT facial-tracking outputs from RAVDESS videos."
requires-python = ">=3.11,<3.14"
dependencies = [
    "py-feat==2.0.3",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "torchcodec==0.14.0",
    "pandas",
    "numpy<2",
    "scipy<1.12",
    "matplotlib",
    "plotly",
    "seaborn",
    "imageio[ffmpeg]",
    "tqdm",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchcodec = { index = "pytorch-cu130" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
