[project]
name = "felt-processing"
version = "0.1.0"
description = "Scripts for generating FELT facial-tracking outputs from RAVDESS videos."
requires-python = ">=3.10,<3.11"
dependencies = [
    "py-feat",
    "torch==2.2.0",
    "torchvision==0.17.0",
    "torchaudio==2.2.0",
    "pandas",
    "numpy",
    "scipy",
    "matplotlib",
    "seaborn",
    "imageio[ffmpeg]",
    "tqdm",
    "h5py",
]

[tool.uv]
package = false